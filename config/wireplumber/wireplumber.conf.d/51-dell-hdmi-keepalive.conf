# Keep the monitor's HDMI audio path awake so short sounds are not clipped.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_2d_00.1.hdmi-stereo-extra1"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
